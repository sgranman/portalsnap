# Builds the Android app on every push and pull request that touches it, and keeps the debug
# APK as a download on the run for two weeks.
name: Android build

on:
  push:
    branches: [main, android-native]
    paths:
      - "android/**"
      - "public/models/**"
      - ".github/workflows/android.yml"
  # Every pull request into main, whatever it touches: main's ruleset requires this check, and a
  # path filter would leave a web-only pull request waiting on a check that never runs.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The status check main's ruleset requires is this name.
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle and checks the wrapper jar is the genuine one.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: portalsnap-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
