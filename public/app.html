<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PortalSnap</title>
<style>
  :root {
    --bg: #0e0f16;
    --bar: #191b26;
    --line: #2b2e3d;
    --ink: #ffffff;
    --dim: #a2a8bd;
    --accent: #6d5bf5;
    --hot: #ff5c8a;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
    user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* Selfie view: mirror the stage so video and overlay stay in lockstep. */
  #stage {
    position: relative; flex: 1; min-height: 0;
    background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #stage > .mirror {
    position: relative; height: 100%; aspect-ratio: 16 / 9;
    transform: scaleX(-1);
  }
  /* Scoped to .mirror, not #stage: the review and album overlays live in the
     stage too, and a bare `#stage video` rule made their players full-bleed
     and absolutely positioned — swallowing taps meant for the buttons under
     them. Only the two preview layers get this treatment. */
  #stage > .mirror > video, #stage > .mirror > canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; object-fit: cover;
  }

  /* Type scale is deliberately wide: 44 / 22 / 13. Small children read the
     big words and ignore the rest. */
  #loader {
    position: absolute; inset: 0; z-index: 30;
    background: radial-gradient(circle at 50% 40%, #241f4d, #0e0f16 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 20px;
  }
  #loader h1 { font-size: 44px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
  #loader p { font-size: 22px; color: var(--dim); margin: 0; max-width: 22ch; }
  #loader.hidden { display: none; }
  .spinner {
    width: 54px; height: 54px; border-radius: 50%;
    border: 6px solid rgba(255,255,255,.15); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #hint {
    position: absolute; z-index: 20; left: 50%; top: 18px;
    transform: translateX(-50%);
    background: rgba(0,0,0,.62); border-radius: 999px;
    padding: 10px 20px; font-size: 20px; font-weight: 600;
    opacity: 0; transition: opacity .25s;
  }
  #hint.show { opacity: 1; }

  /* Recording badge. Sits opposite the hint so the two never collide. */
  #rectimer {
    position: absolute; z-index: 22; left: 18px; top: 18px;
    display: none; align-items: center; gap: 10px;
    background: rgba(0,0,0,.66); border-radius: 999px;
    padding: 10px 20px 10px 16px;
    font: 700 20px/1 "Segoe UI", sans-serif; font-variant-numeric: tabular-nums;
  }
  #rectimer.show { display: flex; }
  #rectimer .dot {
    width: 16px; height: 16px; border-radius: 50%; background: #ff3b5c;
    animation: blink 1s steps(1, end) infinite;
  }
  @keyframes blink { 50% { opacity: .15; } }
  /* A red frame is the unmissable "we are recording" cue on a shared screen. */
  #stage.recording::after {
    content: ""; position: absolute; inset: 0; z-index: 19; pointer-events: none;
    border: 5px solid #ff3b5c;
  }

  /* Bottom bar */
  #bar {
    flex: 0 0 auto; background: var(--bar); border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  }
  #strip {
    flex: 1; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; padding: 2px;
  }
  #strip::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; width: 96px; height: 96px; border-radius: 22px;
    border: 3px solid transparent; background: #262a3a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; cursor: pointer; touch-action: manipulation;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .chip .emo { font-size: 38px; line-height: 1; }
  .chip .lbl { font-size: 13px; font-weight: 700; color: var(--dim); letter-spacing: .02em; }
  .chip.on { border-color: var(--accent); background: #322c62; transform: translateY(-3px); }
  .chip.on .lbl { color: #fff; }
  .chip:active { transform: scale(.94); }

  /* Three round buttons, all the same size: nothing here needs a small target. */
  .big {
    flex: 0 0 auto; width: 96px; height: 96px; border-radius: 50%;
    border: 5px solid #fff; background: var(--hot);
    font-size: 34px; color: #fff; cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }

  /* Deliberately quieter and smaller than the three camera buttons: full screen
     is something you set once, not part of playing with the filters. */
  .small {
    flex: 0 0 auto; width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .45); background: var(--line);
    color: #fff; cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .small svg { width: 26px; height: 26px; display: block; }
  /* An SVG rather than a glyph: this device has no webfont to fall back on and
     the corner-bracket characters are not in its emoji set. */
  .big:active { transform: scale(.92); }
  .big:disabled { opacity: .35; }
  #record { background: #2b3350; }
  #record.on { background: #ff3b5c; border-radius: 26px; }
  #album { background: #2b3350; border-color: #6b7290; font-size: 32px; }

  /* Review — one overlay for both a still and a clip.
     Fixed and opaque, covering the filter strip too: these are modes, not
     stage decorations. A translucent panel left the live preview ghosting
     through and the chips underneath tappable to no effect. */
  #review, #gallery {
    position: fixed; inset: 0; z-index: 40; background: #0b0c13;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 18px;
  }
  #review.show, #gallery.show { display: flex; }
  /* Fixed box + contain rather than max-*: a still and a clip then occupy the
     same space, so the buttons don't jump down when a clip's metadata loads
     and a tapping child doesn't hit a moving target. */
  #review img, #review video {
    width: 78%; height: 56%; object-fit: contain;
    border-radius: 16px; border: 3px solid #fff; background: #000;
  }
  .acts { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .acts button {
    font: inherit; font-size: 22px; font-weight: 700; color: #fff;
    background: var(--accent); border: 0; border-radius: 16px;
    padding: 18px 30px; cursor: pointer; touch-action: manipulation;
  }
  .acts button.alt { background: #343850; }
  .acts button.danger { background: #7c2340; }
  .acts button:disabled { opacity: .5; }
  #saveMsg { font-size: 19px; color: var(--dim); min-height: 24px; text-align: center; }
  #saveMsg.good { color: var(--ok); }
  #saveMsg.bad { color: #ff8fa8; }

  /* Album */
  #gallery { justify-content: flex-start; gap: 14px; }
  .gtop {
    width: 100%; display: flex; align-items: center; gap: 16px;
    flex: 0 0 auto;
  }
  .gtop h2 { font-size: 30px; margin: 0; flex: 1; }
  .gtop button {
    font: inherit; font-size: 20px; font-weight: 700; color: #fff;
    background: #343850; border: 0; border-radius: 14px; padding: 14px 22px;
    cursor: pointer; touch-action: manipulation;
  }
  #grid {
    flex: 1; min-height: 0; width: 100%; overflow-y: auto;
    /* min(46%, …) so a narrow phone still gets two columns: a fixed 210px
       minimum cannot fit two across 390px and collapses to one full-width tile
       per row, which reads as one long stack rather than a gallery. */
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 200px), 1fr));
    gap: 12px; align-content: start;
  }
  #grid .tile {
    position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
    background: #1c1f2c; border: 2px solid #2b2e3d; cursor: pointer;
  }
  #grid .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Videos get a placeholder tile, not a <video> — a grid of decoders would
     flatten a 2GB device. The clip only loads when it's opened. */
  #grid .tile.vid {
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; background: #241f4d;
  }
  /* Sits over the preview frame so a clip still reads as a clip. */
  #grid .tile .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.7);
    background: rgba(0,0,0,.18); pointer-events: none;
  }
  #grid .tile .when {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(transparent, rgba(0,0,0,.8));
    font-size: 13px; font-weight: 700; padding: 14px 8px 6px; text-align: center;
  }
  #grid .empty { grid-column: 1 / -1; color: var(--dim); font-size: 20px; padding: 24px 4px; }
  #ghelp { flex: 0 0 auto; font-size: 16px; color: var(--dim); text-align: center; }
  #ghelp b { color: #cbd0e2; }

  #viewer {
    position: absolute; inset: 0; z-index: 45; background: #0b0c13;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 18px;
  }
  #viewer.show { display: flex; }
  #viewer img, #viewer video {
    width: 84%; height: 62%; object-fit: contain;
    border-radius: 16px; border: 3px solid #fff; background: #000;
  }

  #flash {
    position: absolute; inset: 0; z-index: 35; background: #fff;
    opacity: 0; pointer-events: none;
  }
  #flash.fire { animation: flash .32s ease-out; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

  #hud {
    position: absolute; z-index: 20; right: 10px; bottom: 10px;
    font: 12px/1.4 ui-monospace, Menlo, monospace; color: #7dd3a0;
    background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 8px;
    white-space: pre; display: none;
  }
  #hud.show { display: block; }
  #hudTap { position: absolute; z-index: 21; right: 0; bottom: 0; width: 64px; height: 64px; }
  /* Only live while the HUD is up, so a child can't wander into it. */
  #backendTap { position: absolute; z-index: 21; left: 0; bottom: 0; width: 64px; height: 64px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div class="mirror">
      <video id="v" autoplay playsinline muted></video>
      <canvas id="fx"></canvas>
    </div>
    <div id="hint"></div>
    <div id="rectimer"><span class="dot"></span><span id="recclock">0:00</span></div>
    <div id="flash"></div>
    <div id="hud"></div>
    <div id="hudTap"></div>
    <div id="backendTap"></div>
    <div id="loader">
      <div class="spinner"></div>
      <h1>PortalSnap</h1>
      <p id="loadMsg">Waking up the camera…</p>
    </div>
    <div id="review">
      <!-- Both stay `hidden` until a capture fills one in, so neither can
           flash as a broken-image box. -->
      <img id="shot" alt="Your photo" hidden>
      <video id="clip" playsinline loop controls hidden></video>
      <div class="acts">
        <button id="keep">Keep it</button>
        <button id="share" class="alt" hidden>Send</button>
        <button id="again" class="alt">Take another</button>
      </div>
      <div id="saveMsg"></div>
    </div>

    <div id="gallery">
      <div class="gtop">
        <h2>Photos</h2>
        <button id="gclose">Back to camera</button>
      </div>
      <div id="grid"></div>
      <div id="ghelp"></div>
      <div id="viewer">
        <img id="vimg" alt="Saved photo" hidden>
        <video id="vvid" playsinline controls hidden></video>
        <div class="acts">
          <button id="vclose" class="alt">Back</button>
          <button id="vdel" class="danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div id="bar">
    <div id="strip"></div>
    <!-- Hidden outright if the browser can't do it, rather than left as a dead
         control — see the fullscreen block at the end of the script. -->
    <button id="fs" class="small" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path id="fsIcon" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
      </svg>
    </button>
    <button id="album" class="big" aria-label="See saved photos">🖼️</button>
    <button id="record" class="big" aria-label="Record a video">🎥</button>
    <button id="shutter" class="big" aria-label="Take photo">📸</button>
  </div>
</div>

<!-- Classic script: shared by the worker (importScripts) and the fallback path. -->
<script src="./anchors.js"></script>
<script type="module">
import { FILTERS } from "./filters.js";

const el = id => document.getElementById(id);
const video = el("v"), fx = el("fx"), ctx = fx.getContext("2d");

let worker = null, stream = null;
let mainDetector = null, backend = "worker", mainClock = 0;
let trackerBroken = null;
// Diagnostic override, set by the bottom-left tap target. null = prefer the
// worker and fall back, "main" = force main-thread inference.
let forceBackend = null;
let active = null;              // current filter, null = none
let trackerMode = "fast";       // "fast" = blazeface, "mesh" = landmarks, "segment" = person mask
// The person mask, for filters that replace the background. Held as the raw
// bytes the worker sent plus a small canvas built from them, because the canvas
// is what the compositing actually uses and rebuilding it per frame is the cost.
let segMask = null, segCanvas = null, segCtx = null, segShare = 0;
let inFlight = false, seq = 0;
let lastResultAt = 0, lastInferMs = 0, lastGrabMs = 0, detFps = 0, detTimes = [];

// Smoothed anchors, in normalized coords. `target` is the latest detection,
// `shown` is what we draw — it chases the target every render frame.
let target = null, shown = null;

// Per-anchor velocity in normalized units per ms, smoothed across detections,
// used to lead the target by the pipeline latency. See Anchors.project.
//
// `predConf` gates how much of that lead we actually take. Simulated against
// the on-device rates, ungated prediction was 27% better on a smooth head turn
// but 16% WORSE on a fast snap and 17% noisier when still — velocity estimated
// from 10fps detections simply cannot follow a sharp reversal. Scaling the lead
// by how well each new velocity agrees with the smoothed one keeps most of the
// gain and erases both regressions: -14% / -5% / -1%.
let vel = {}, predConf = 0;
const PREDICT_ALPHA = 0.55;      // velocity smoothing across detections
const PREDICT_CONF_ALPHA = 0.5;  // how fast confidence collapses on a reversal
const PREDICT_CLAMP = 0.05;      // rail against noise spikes; normal motion never reaches it
const PREDICT_MAX_MS = 140;      // never lead further than the worst latency seen
const REACQUIRE_MS = 400;        // a gap this long means the face moved unseen

// One pixel of the tracker's 320-wide input, in normalized units — about 4px
// across a 1280 frame, or 1% of a face's width. Anchors are not moved by less
// than this. See ease(), and `jit` on the HUD for what the noise floor actually
// measures on the device.
const EASE_DEADBAND = 1 / 320;

// Per-detection anchor movement, for that HUD line. Kept as a small ring since
// the only question asked of it is a median.
let moveMags = [];

function hint(msg, ms = 2200) {
  el("hint").textContent = msg;
  el("hint").classList.add("show");
  clearTimeout(hint._t);
  hint._t = setTimeout(() => el("hint").classList.remove("show"), ms);
}

/* ------------------------------ Startup ------------------------------ */

async function boot() {
  try {
    el("loadMsg").textContent = "Waking up the camera…";
    const wantVideo = { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" };

    // Mic comes up with the camera so there is one permission prompt, not two
    // mid-session. The track is never routed to an output — it exists only to
    // be handed to MediaRecorder — so there is no feedback loop.
    // Mic DSP left on. It was turned off on the theory that Chrome only starts
    // that processing graph once something consumes the track — which
    // MediaRecorder does, matching where inference collapses. Measured
    // on-device: no effect, `infer` stayed at ~100ms. So the theory is dead and
    // the setting goes back to the one that sounds better, since what this
    // records is small children talking in a room.
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: wantVideo,
        audio: { echoCancellation: true, noiseSuppression: true }
      });
    } catch (err) {
      // One rejection covers both tracks, so a missing or refused mic would
      // otherwise cost us the camera too. Silent video beats no video.
      stream = await navigator.mediaDevices.getUserMedia({ video: wantVideo, audio: false });
    }
    video.srcObject = stream;
    await video.play();

    fx.width = video.videoWidth || 1280;
    fx.height = video.videoHeight || 720;

  } catch (err) {
    el("loadMsg").textContent = "Camera problem: " + (err.name || "") + " " + (err.message || err);
    return;
  }

  // Tracking is allowed to fail without taking the app down — showing a child
  // their own face with no filters still beats a dead loading screen.
  try {
    el("loadMsg").textContent = "Loading the magic…";
    await startTracker(trackerMode);
  } catch (err) {
    trackerBroken = "" + ((err && err.message) || err);
    console.warn("tracking unavailable:", trackerBroken);
  }

  el("loader").classList.add("hidden");
  hint(trackerBroken ? "Filters are having a nap — camera still works" : "Pick a filter below!", 4000);
  pump();
  render();
}

function onResult(m) {
  inFlight = false;
  lastInferMs = m.inferMs;
  const now = performance.now();
  detTimes.push(now);
  while (detTimes.length && now - detTimes[0] > 2000) detTimes.shift();
  detFps = detTimes.length / 2;

  if (m.mask) {
    takeMask(m.mask, m.mw, m.mh);
    lastResultAt = now;
    schedulePump(0);
    return;
  }

  if (m.anchors) {
    // Velocity from consecutive detections. A long gap means the face was
    // lost and whatever it was doing then says nothing about now.
    const gap = now - lastResultAt;
    if (!target || gap > REACQUIRE_MS) {
      vel = {};
      predConf = 0;
    } else if (gap > 0) {
      let agree = 0, judged = 0;
      for (const k of KEYS) {
        const a = target[k], b = m.anchors[k];
        if (!a || !b) continue;
        const vx = (b.x - a.x) / gap, vy = (b.y - a.y) / gap;
        const p = vel[k];
        if (p) {
          // Direction agreement scaled by how much the speed changed: braking
          // hard is as poor a basis for extrapolation as turning around.
          const mv = Math.hypot(vx, vy), mo = Math.hypot(p.x, p.y);
          if (mv > 0 && mo > 0) {
            const cos = (vx * p.x + vy * p.y) / (mv * mo);
            agree += Math.max(0, cos) * (Math.min(mv, mo) / Math.max(mv, mo));
            judged++;
          }
        }
        vel[k] = p
          ? { x: p.x + (vx - p.x) * PREDICT_ALPHA, y: p.y + (vy - p.y) * PREDICT_ALPHA }
          : { x: vx, y: vy };
      }
      // One confidence for the whole face: anchors move together, and six
      // independent estimates would just be six ways to jitter.
      if (judged) predConf += (agree / judged - predConf) * PREDICT_CONF_ALPHA;
      else predConf = 0;
    }

    // How far the furthest anchor moved since the last detection. Read while
    // sitting still, its median is the tracker's noise floor, which is the
    // number EASE_DEADBAND has to clear — guessing at it was what made the
    // still-face skip a no-op on the device.
    if (target) {
      let far = 0;
      for (const k of KEYS) {
        const a = target[k], b = m.anchors[k];
        if (a && b) far = Math.max(far, Math.hypot(b.x - a.x, b.y - a.y));
      }
      moveMags.push(far);
      if (moveMags.length > 90) moveMags.shift();
    }

    target = m.anchors;
    lastResultAt = now;
  }

  // Re-arm the moment a result lands. Waiting for the next poll tick threw
  // away up to 16ms per detection — roughly a third of the cycle, and the
  // reason detection ran at half of what inference alone allows. Deferred by
  // a tick rather than called straight through, because on the main-thread
  // backend onResult runs *inside* pump and would re-enter it.
  schedulePump(0);
}

// Prefer the worker; fall back to main-thread inference rather than stranding
// a child on a loading screen. The fallback blocks for ~23ms per detection,
// which is worse but still usable.
async function startTracker(mode) {
  target = shown = null;
  segMask = null;
  segShare = 0;
  vel = {};
  predConf = 0;
  inFlight = false;
  if (forceBackend !== "main") {
    try {
      await startWorker(mode);
      // Releasing the main-thread detector matters once these can be swapped:
      // two loaded models on a 2GB device is a model too many.
      if (mainDetector) { try { mainDetector.close(); } catch (e) {} mainDetector = null; }
      backend = "worker";
      trackerMode = mode;
      return;
    } catch (err) {
      console.warn("worker unavailable:", err.message);
      el("loadMsg").textContent = "Almost there…";
    }
  }
  await startMainThread(mode);
  backend = "main";
  trackerMode = mode;
}

function startWorker(mode) {
  return new Promise((resolve, reject) => {
    if (worker) { worker.terminate(); worker = null; }

    let settled = false;
    const w = new Worker("./tracker.worker.js");   // classic, not module — see the worker file
    const finish = (fn, arg) => { if (!settled) { settled = true; clearTimeout(timer); fn(arg); } };

    // Without this, any silent init failure hangs on the loading screen forever.
    const timer = setTimeout(() => {
      finish(reject, new Error("tracker init timed out after 20s"));
      w.terminate();
    }, 20000);

    w.onmessage = e => {
      const m = e.data;
      if (m.type === "ready") { worker = w; finish(resolve, m); return; }
      if (m.type === "error") {
        if (m.fatal) { w.terminate(); finish(reject, new Error(m.message)); }
        else console.warn("tracker:", m.message);
        return;
      }
      if (m.type === "result") onResult(m);
    };
    w.onerror = ev => { w.terminate(); finish(reject, new Error(ev.message || "worker failed to load")); };

    w.postMessage({ type: "init", mode });
  });
}

async function startMainThread(mode) {
  if (worker) { worker.terminate(); worker = null; }
  if (mainDetector) { mainDetector.close(); mainDetector = null; }
  const V = await import("./vendor/mediapipe/vision_bundle.mjs");
  mainDetector = await window.Anchors.createDetector(V, mode);
}

/* --------------------- Frame pump (one in flight) --------------------- */

// Exactly one timer is ever pending. onResult re-arms early, and this keeps
// that from leaving a second one ticking behind it.
let pumpTimer = 0;
function schedulePump(delay) {
  clearTimeout(pumpTimer);
  pumpTimer = setTimeout(pump, delay);
}

// Only ever one frame in the worker: queueing them would add latency without
// adding detections, and every queued bitmap is memory this device lacks.
async function pump() {
  // Review and album cover the stage completely, and both may be playing a
  // clip. Inference there would be invisible work competing for the decoder.
  if (video.readyState >= 2 && !inFlight && !overlayUp() && (worker || mainDetector)) {
    inFlight = true;
    let bmp = null;
    try {
      // 320-wide input measured fastest for blazeface and costs the landmarker
      // nothing, since it resizes to a fixed tensor internally anyway. The
      // segmenter's mask comes back at whatever size it is fed, and that mask has
      // to be read back to the CPU every frame — so it gets a smaller frame, and
      // the softness of scaling 256 wide up to the display feathers the cut-out
      // edge for free.
      const t0 = performance.now();
      const gw = trackerMode === "segment" ? 256 : 320;
      bmp = await createImageBitmap(video, {
        resizeWidth: gw, resizeHeight: Math.round(gw * 9 / 16), resizeQuality: "low"
      });
      lastGrabMs = performance.now() - t0;

      if (backend === "worker" && worker) {
        worker.postMessage({ type: "frame", bitmap: bmp, seq: ++seq }, [bmp]);
        bmp = null;   // ownership transferred
      } else if (mainDetector) {
        const t0 = performance.now();
        const res = mainDetector.detectForVideo(bmp, (mainClock += 34));
        onResult({
          anchors: window.Anchors.toAnchors(res, trackerMode),
          inferMs: performance.now() - t0
        });
      } else {
        inFlight = false;
      }
    } catch (e) {
      inFlight = false;
    } finally {
      if (bmp) { try { bmp.close(); } catch (e) {} }
    }
  }
  // Watchdog only. The live path is onResult re-arming; this just keeps the
  // loop alive if a result never comes back, without polling hot meanwhile.
  schedulePump(inFlight ? 250 : 16);
}

// Build the alpha mask the compositing uses: transparent where the background
// is, opaque where the person is.
//
// Which category means "person" is decided from the mask's own corners rather
// than assumed. The model's convention has changed between releases, and a
// filter that silently cuts out the *background* instead of the person would
// look like a rendering bug rather than a wrong constant. The corners of a
// webcam frame are background essentially always.
function takeMask(bytes, mw, mh) {
  if (!mw || !mh) return;
  if (!segCanvas || segCanvas.width !== mw || segCanvas.height !== mh) {
    segCanvas = document.createElement("canvas");
    segCanvas.width = mw; segCanvas.height = mh;
    segCtx = segCanvas.getContext("2d");
  }
  const corners = [0, mw - 1, (mh - 1) * mw, mh * mw - 1].map(i => bytes[i]);
  const bg = corners.sort((a, b) =>
    corners.filter(v => v === a).length - corners.filter(v => v === b).length).pop();

  const img = segCtx.createImageData(mw, mh);
  const d = img.data;
  let person = 0;
  for (let i = 0, j = 3; i < bytes.length; i++, j += 4) {
    if (bytes[i] !== bg) { d[j] = 255; person++; }
  }
  segCtx.putImageData(img, 0, 0);
  segMask = segCanvas;
  // Reported on the HUD. A person at normal framing is a fraction of the frame;
  // 0% or 99% means the model is not doing what it is meant to, and that is
  // worth being able to see on the device rather than guess at.
  segShare = person / (mw * mh);
}

/* ---------------------- Smoothing + render loop ---------------------- */

// The six blazeface keypoints, then the dense-model extras. Every loop over
// KEYS skips a point the current tracker didn't supply, so one list serves both
// tiers — and the extras get the same easing, leading and deadband as the rest
// rather than a private path of their own.
const KEYS = [
  "eyeR", "eyeL", "nose", "mouth", "earR", "earL",
  "headTop", "skullR", "skullL", "templeR", "templeL", "browR", "browL",
  "chin", "jawR", "jawL", "noseUnder", "nostrilR", "nostrilL",
  "lipBottom", "mouthR", "mouthL"
];

// Detections land at 17-30fps but we draw at the display rate, so `shown`
// eases toward `target`. Alpha rises with distance: snappy on fast head
// movement, still on slow — the cheap half of a one-euro filter.
function ease(dt) {
  if (!target) return;
  if (!shown) { shown = JSON.parse(JSON.stringify(target)); return; }

  // Lead by the latency we can measure: the frame was grabbed `grab` ms before
  // it went to the tracker, and inference took `infer` on top of that.
  const lead = Math.min(PREDICT_MAX_MS, lastGrabMs + lastInferMs) * predConf;

  for (const k of KEYS) {
    if (!target[k] || !shown[k]) continue;
    const aim = window.Anchors.project(target[k], vel[k], lead, PREDICT_CLAMP);
    const dx = aim.x - shown[k].x, dy = aim.y - shown[k].y;
    const dist = Math.hypot(dx, dy);
    // Movement below the tracker's own input resolution cannot be movement: the
    // model is fed a 320-wide frame, so anything under one of those pixels is
    // regression noise, not a head. Chasing it made the sticker vibrate on a
    // motionless face, and — measured on-device — meant every render frame had
    // "changed", so the still-face skip never fired once. `paint` sat at the
    // render rate with a child sitting perfectly still.
    if (dist < EASE_DEADBAND) continue;
    const a = Math.min(1, (0.18 + dist * 12) * (dt / 16.7));
    shown[k].x += dx * a;
    shown[k].y += dy * a;
  }

  shown.blendshapes = shown.blendshapes || {};
  const tb = target.blendshapes || {};
  for (const k in tb) {
    const cur = shown.blendshapes[k] || 0;
    shown.blendshapes[k] = cur + (tb[k] - cur) * Math.min(1, 0.25 * (dt / 16.7));
  }
}

// Pixel-space frame every filter draws against.
function buildFace(a) {
  const w = fx.width, h = fx.height;
  const eyeR = { x: a.eyeR.x * w, y: a.eyeR.y * h };
  const eyeL = { x: a.eyeL.x * w, y: a.eyeL.y * h };
  const cx = (eyeR.x + eyeL.x) / 2, cy = (eyeR.y + eyeL.y) / 2;
  const dx = eyeL.x - eyeR.x, dy = eyeL.y - eyeR.y;
  const eyeDist = Math.max(1, Math.hypot(dx, dy));
  const angle = Math.atan2(dy, dx);

  // Express nose/mouth in face space so filters never touch raw pixels.
  const cos = Math.cos(-angle), sin = Math.sin(-angle);
  const toFace = p => {
    const px = p.x * w - cx, py = p.y * h - cy;
    return { x: (px * cos - py * sin) / eyeDist, y: (px * sin + py * cos) / eyeDist };
  };

  const nose = toFace(a.nose), mouth = toFace(a.mouth);
  const earR = toFace(a.earR), earL = toFace(a.earL);

  // Ear span is the honest measure of head width; eye distance alone
  // under-sizes hats and ears badly on wider or younger faces.
  const earSpan = Math.max(0.8, Math.hypot(earL.x - earR.x, earL.y - earR.y));

  // Yaw from how far the nose sits off the ear midpoint, as a fraction of the
  // half-span: -1 fully turned one way, +1 the other. Lets flat stickers slide
  // across the face instead of floating when the head turns.
  const earMidX = (earR.x + earL.x) / 2;
  const yaw = Math.max(-1, Math.min(1, (nose.x - earMidX) / (earSpan / 2)));

  const face = {
    cx, cy, angle, eyeDist,
    nose, mouth, earR, earL, earSpan, yaw,
    noseY: nose.y,
    mouthY: mouth.y,
    blendshapes: a.blendshapes || {},
    dense: !!a.dense
  };

  // Whatever the dense model supplied, in the same face space. A filter reading
  // any of these must declare `needsMesh`; in fast mode they are simply absent
  // and `dense` is false.
  for (const k of KEYS) {
    if (!(k in face) && a[k]) face[k] = toFace(a[k]);
  }

  // Real head width, measured at the widest vertices of the canonical model
  // (+-7.74) rather than at the cheeks, which sit lower and further back.
  face.headSpan = face.templeR && face.templeL
    ? Math.max(0.8, Math.hypot(face.templeL.x - face.templeR.x, face.templeL.y - face.templeR.y))
    : earSpan;

  // Top of the head. With the dense model this is a measured landmark — the
  // highest of the 468.
  //
  // Without it, it stays a proportion of eye-line-to-mouth, but a measured one.
  // The old factor of 1.3 was invented, and against the canonical model it
  // overshoots by 1.55x: the crown sits 0.630 face units above the eye line
  // where the mouth sits 0.749 below, so the honest ratio is 0.84. That single
  // wrong constant is why hats floated above heads in fast mode.
  face.headTopY = face.headTop ? face.headTop.y : -0.84 * Math.abs(mouth.y);

  return face;
}

// Redrawing the overlay every display frame was the largest single cost in the
// app: measured on-device at +11ms of inference, and 24fps of detection down to
// 18.5. Most of that is the fixed price of dirtying a composited layer rather
// than fill rate — halving the canvas resolution recovered 3ms of the 11 —
// so the fix is mainly to draw less often, and only secondarily smaller. 30Hz
// is the honest ceiling anyway: the camera delivers 30fps and detections arrive
// slower still, so anything above it redrew the same information twice.
const RENDER_MIN_DT = 1000 / 30 - 1;

// Two things make a redraw pointless, and both are common. Nothing has moved
// since the last paint — a child sitting still holds `shown` inside a fraction
// of a pixel — or the filter has no clock of its own, so the same anchors
// produce the same picture. Skipping is worth roughly what capping the rate was
// worth, because it is the same saving: a frame not drawn.
const STILL_EPS = 0.0005;    // normalized units, so 0.6px across a 1280 frame

// Three of the six filters animate on their own clock — a sway, a sparkle, a
// pupil bob — so they cannot be skipped outright when the face holds still. The
// slowest of those cycles takes about a second, though, so half the redraws
// were showing the same picture twice. They get 15Hz instead of 30.
const ANIM_MIN_DT = 1000 / 15 - 1;

// Compared against the last *painted* state rather than the previous frame, so
// a slow drift still repaints once it adds up to something visible.
let painted = null, paintedId = "", lastPaintAt = 0;

// The pitch the current filter is asking for, kept for the HUD: a filter that
// derives it from the face has no single number to report otherwise.
let shownVoice = 1;

function needsPaint(now) {
  if (!painted || paintedId !== active.id) return true;
  // A filter that takes the video samples live pixels, so its output changes
  // even when the face does not. Skipping those frames would freeze a stale
  // copy of the picture on screen — the one case where a still face still needs
  // every frame drawn.
  if (active.draw.length >= 4 || active.needsSegment) return true;
  for (const k of KEYS) {
    const a = painted[k], b = shown[k];
    if (!a !== !b) return true;
    if (a && (Math.abs(a.x - b.x) > STILL_EPS || Math.abs(a.y - b.y) > STILL_EPS)) return true;
  }
  const pb = painted.blendshapes, sb = shown.blendshapes || {};
  for (const k in sb) if (Math.abs((pb[k] || 0) - sb[k]) > 0.01) return true;
  // Nothing moved. Whether there is still a reason to redraw depends on the
  // filter having a clock, which is read off its signature: a filter that
  // declares the time argument uses it. Keeping that in the signature rather
  // than in a flag means it cannot drift out of step with the filter itself.
  return active.draw.length >= 3 && now - lastPaintAt >= ANIM_MIN_DT;
}

// A filter that throws part-way through leaves the context transformed, and
// every later clearRect would then clear a rotated sliver instead of the canvas
// — one bad filter freezing the overlay for the rest of the session. reset()
// puts the transform and the save stack back as well as clearing.
function wipe() {
  if (ctx.reset) ctx.reset();
  else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, fx.width, fx.height); }
}

// Only the anchors and blendshapes, never the mesh: a 478-point copy 30 times
// a second would cost more than the redraw it saves.
function snapshot(a) {
  const s = { blendshapes: Object.assign({}, a.blendshapes) };
  for (const k of KEYS) if (a[k]) s[k] = { x: a[k].x, y: a[k].y };
  return s;
}

// Median of the movement ring, in overlay pixels — the ring holds the *largest*
// anchor step per detection, so this is the step size that decides whether a
// repaint fires. Sorted on read rather than kept sorted: it is read once per HUD
// line, and only while the HUD is up.
function jitterPx() {
  if (!moveMags.length) return 0;
  const s = moveMags.slice().sort((a, b) => a - b);
  return s[s.length >> 1] * fx.width;
}

let lastDraw = performance.now(), overlayDirty = false;
let paintTimes = [], paintFps = 0;
function render() {
  requestAnimationFrame(render);   // keep the loop alive even on skipped frames

  const now = performance.now();
  if (now - lastDraw < RENDER_MIN_DT) return;
  const dt = Math.min(50, now - lastDraw);
  lastDraw = now;

  const hidden = overlayUp();
  const fresh = now - lastResultAt < 800;   // hide the overlay if tracking drops
  // Gated on `target`, not `shown`: `shown` is seeded by the first ease() call,
  // so requiring it here meant a filter picked from a cold start could never
  // begin drawing at all. A segmenting filter has no anchors at all and waits on
  // a mask instead.
  const segTier = !!(active && active.needsSegment);
  const wantDraw = !!(active && fresh && !hidden && (segTier ? segMask : target));

  if (wantDraw) {
    if (!segTier) ease(dt);
    if (needsPaint(now)) {
      wipe();
      // What the tracker knows: a face, or where the person is.
      const f = segTier ? { mask: segMask, share: segShare, blendshapes: {} } : buildFace(shown);
      // The video is handed to the filter as a fourth argument. Overlay and
      // video are the same size and share the stage's mirror, so pixels sampled
      // from one land in the right place on the other — which is what makes a
      // zoomed head or a face pasted onto a cartoon possible without a second
      // renderer.
      try { active.draw(ctx, f, now, video); }
      catch (e) { console.warn("filter", active.id, e); }
      // A filter may set the pitch from the face itself, so a head that grows
      // can drop the voice with it. Applied only while recording — nothing is
      // listening otherwise and the graph is suspended — but tracked either way,
      // so the HUD can show what the next clip would sound like.
      shownVoice = voiceOf(active, f);
      if (recording && active.voiceFrom) setVoice(shownVoice);
      painted = segTier ? { blendshapes: {} } : snapshot(shown);
      paintedId = active.id;
      overlayDirty = true;
      lastPaintAt = now;
      paintTimes.push(now);
    }
  } else if (overlayDirty) {
    // Clear once, then stop touching it. A layer nobody writes to costs the
    // compositor nothing, but clearing it every frame costs the same as drawing
    // — which is what the old loop did whenever no filter was picked or no face
    // was in view.
    wipe();
    overlayDirty = false;
    painted = null;
  }
  while (paintTimes.length && now - paintTimes[0] > 1000) paintTimes.shift();
  paintFps = paintTimes.length;

  if (el("hud").classList.contains("show")) {
    el("hud").textContent =
      "mode    " + trackerMode +
      "\nbackend " + (trackerBroken ? "FAILED" : backend) +
      "\ngrab    " + lastGrabMs.toFixed(0) + " ms" +
      "\ninfer   " + lastInferMs.toFixed(0) + " ms" +
      // What's left after grab+infer is loop overhead — the number to chase.
      "\ncycle   " + (detFps > 0 ? (1000 / detFps).toFixed(0) : "-") + " ms" +
      "\ndetect  " + detFps.toFixed(1) + " fps" +
      // Capped at 30 on purpose — reads low by design, not as a symptom.
      "\nrender  " + (1000 / dt).toFixed(0) + " fps (cap 30)" +
      // Redraws actually issued. Well under `render` means the still-face skip
      // is earning its keep; equal to it means every frame changed something.
      "\npaint   " + paintFps + " /s" +
      // Typical size of the largest anchor's step between detections, in overlay
      // pixels. Sitting still, that is the tracker's noise floor. The further it
      // sits under EASE_DEADBAND (4 px) the more redraws get skipped — it is a
      // slope, not a cliff, since each anchor is deadbanded on its own.
      "\njit     " + jitterPx().toFixed(1) + " px" +
      "\ndrawing " + (wantDraw ? "yes" : "no") +
      "\nface    " + (fresh ? "yes" : "no") +
      "\nmic     " + (stream && stream.getAudioTracks().length ? "yes" : "no") +
      // The pitch the next clip will record at, and whether the graph exists to
      // apply it — "1.42 (off)" means the shifter never came up and the clip
      // will be in the room's own voice.
      "\nvoice   " + shownVoice.toFixed(2) + (voiceNode ? "" : " (off)") +
      // Share of the frame the model calls "person". A child at normal framing
      // is a fraction of it; 0% or ~99% means the segmenter is not working, and
      // that should be visible rather than inferred from a bad-looking picture.
      (trackerMode === "segment"
        ? "\nseg     " + (segShare * 100).toFixed(0) + "% person"
        : "") +
      "\nrecfmt  " + ((pickMime() || "none").replace("video/", "").split(";")[0]) +
      (recording && recCanvas
        ? "\nrec     " + recFps.toFixed(1) + " fps @" + recCanvas.width + "x" + recCanvas.height +
          "\ncomp    " + compMs.toFixed(0) + " ms" +
          "\nframe   " + frameMs.toFixed(0) + " ms"
        : "") +
      (trackerBroken ? "\nerr     " + trackerBroken.slice(0, 90) : "");
  }
}

/* ------------------------------ Filters ------------------------------ */

function buildStrip() {
  const strip = el("strip");

  const none = chip("🚫", "None", null);
  none.classList.add("on");
  strip.appendChild(none);

  for (const f of FILTERS) strip.appendChild(chip(f.emoji, f.name, f));
}

function chip(emoji, label, filter) {
  const b = document.createElement("div");
  b.className = "chip";
  b.innerHTML = '<div class="emo"></div><div class="lbl"></div>';
  b.children[0].textContent = emoji;
  b.children[1].textContent = label;
  b.onclick = () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    b.classList.add("on");
    active = filter;
    // Set it here as well as during a paint: with no face in view nothing paints,
    // and the HUD should still be able to say what the next clip would sound like.
    shownVoice = voiceOf(filter);
    setVoice(shownVoice);        // no-op unless a clip has already built the graph
    if (filter) selectTracker(filter);
  };
  return b;
}

// Only pay for the 3.7MB mesh model when a filter actually needs it, and swap
// to the segmenter for filters that want the person rather than the face.
const tierOf = f => (f && f.needsSegment ? "segment" : f && f.needsMesh ? "mesh" : "fast");

async function selectTracker(filter) {
  const want = tierOf(filter);
  if (want === trackerMode || trackerBroken) return;
  hint(want === "mesh" ? "Fetching the puppy…"
       : want === "segment" ? "Finding you…" : "Getting ready…", 2500);
  try {
    await startTracker(want);
  } catch (err) {
    trackerBroken = "" + ((err && err.message) || err);
    hint("That filter is having a nap", 2500);
  }
}

/* ------------------------------ Voices ------------------------------ */

// Four of the filters change how you sound in a clip: the puppy growls, the
// kitten squeaks. The ratio lives on the filter beside `needsMesh`, because it
// is part of what the filter *is* — see `voice` in filters.js.
//
// It is heard on playback, never live. Routing a processed mic to the speakers
// two feet from that same mic is a feedback loop, and this device has no
// headphones. So the effect goes into the recording and the children hear
// themselves when they watch it back, which is the funnier half anyway.
// A filter may state a fixed ratio, or derive one from the face — a head that
// balloons when you open your mouth should sound like it.
function voiceOf(f, face) {
  if (!f) return 1;
  if (f.voiceFrom && face) {
    const r = f.voiceFrom(face);
    return r > 0 ? Math.max(0.5, Math.min(2.5, r)) : 1;
  }
  return f.voice || 1;
}

// Every node in this graph is held in a variable that outlives the function that
// built it, and that is not tidiness — it is the fix for a real bug. A
// MediaStreamAudioSourceNode is collectable as soon as script can no longer
// reach it, *even while it is connected and producing sound*. Held only by a
// local, it survived the first clip or two and then vanished on the next
// collection, leaving a graph that ran happily and output silence. Reproduced by
// forcing a collection between clips: clip 1 at -22dB, clip 2 at -68dB, clips 3
// and 4 at -inf. See test/voice-gc.mjs, which now does exactly that.
let actx = null, voiceNode = null, voiceOut = null, voiceSetup = null;
let voiceSrc = null, voiceIn = null, voiceOutStream = null;

// Built on the first recording and then reused. An AudioContext per clip would
// spend one of this device's few audio threads every time, and creating it
// inside the record tap keeps it inside the user gesture that lets it start.
function ensureVoice() {
  if (voiceSetup) return voiceSetup;
  voiceSetup = (async () => {
    const mic = stream && stream.getAudioTracks();
    if (!mic || !mic.length) return null;               // silent clips need no help
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    const ctxa = new Ctx();
    if (!ctxa.audioWorklet) { try { ctxa.close(); } catch (e) {} return null; }
    await ctxa.audioWorklet.addModule("./pitch.worklet.js");
    // Assigned to the outer variables, not locals: see the note above them.
    voiceIn = new MediaStream([mic[0]]);
    voiceSrc = ctxa.createMediaStreamSource(voiceIn);
    voiceNode = new AudioWorkletNode(ctxa, "pitch-shift");
    voiceOut = ctxa.createMediaStreamDestination();
    voiceOutStream = voiceOut.stream;
    voiceSrc.connect(voiceNode).connect(voiceOut);      // never to ctxa.destination
    actx = ctxa;
    return voiceOutStream.getAudioTracks()[0] || null;
  })().catch(err => {
    // A missing voice must never cost a recording, the same way a refused mic
    // is not allowed to cost the camera.
    console.warn("voice unavailable:", (err && err.message) || err);
    return null;
  });
  return voiceSetup;
}

// Safe to call at any time, including mid-clip when a child taps a new filter.
function setVoice(ratio) {
  if (!voiceNode) return;
  const p = voiceNode.parameters.get("ratio");
  if (p) p.value = ratio;
}

/* ----------------------------- Capture ------------------------------ */

// The Portal browser refuses file downloads outright, and no web API can
// reach the device's own photo album, so a capture is only "saved" once the
// server has it. Everything below funnels into upload().

const MAX_CLIP_MS = 30000;

// Full camera resolution. Dropping this to 540p was tried and measured on the
// Portal: it moved neither the composite rate nor inference, because `comp`
// runs at a couple of ms and the loop is limited by how fast the camera hands
// over frames (~20fps in a dimly lit room), not by pixels. The scaling is kept
// because it costs nothing and makes the ceiling adjustable if that changes.
const REC_WIDTH = 1280;
const REC_VIDEO_BPS = 2500000;
const REC_AUDIO_BPS = 96000;

// Recording's cost is `captureStream`/`requestFrame`, at +14ms per captured
// frame — measured, and the largest single number in the whole budget. Capping
// the composite below the camera's rate is the only thing that touches it:
// on-device, 15fps gave 47ms inference and 16fps detection against 63ms and
// 12fps uncapped. That trade is worth taking in a face filter, where a sticker
// that tracks properly is more of the point than the frame rate is. 20 rather
// than 15 because the camera only delivers ~26fps while recording anyway
// (`frame` measured 39ms), so this is nearer to what was already happening than
// the number suggests. Raise it to 30 to disable the cap.
const REC_COMPOSITE_HZ = 20;

let pending = null;        // { kind, blob, url, ext } awaiting Keep or discard
let recorder = null, recTrack = null, recCanvas = null, recCtx = null;
let recChunks = [], recMime = "", recording = false, recArming = false;
let recStartedAt = 0, recTick = 0, recFrames = 0, recFps = 0;
// Split the recording loop: time inside the composite itself, versus the
// interval at which the camera actually hands us frames. 540p composited at
// the same rate as 720p, so one of these is resolution-independent and it
// matters a great deal which. Smoothed, because single frames are noisy.
let compMs = 0, frameMs = 0, lastFrameAt = 0;

function overlayUp() {
  return el("review").classList.contains("show") || el("gallery").classList.contains("show");
}

// The loader covers the stage but not the bar, so all three buttons are
// tappable while the camera is still coming up — or after it has failed.
function ready() {
  return !!stream && video.readyState >= 2;
}

// Composites video + overlay into `c`, mirrored to match what's on screen.
function compose(c, cctx) {
  cctx.drawImage(video, 0, 0, c.width, c.height);
  cctx.drawImage(fx, 0, 0, c.width, c.height);
}

/* ------------------------------- Photo ------------------------------- */

el("shutter").onclick = () => {
  if (recording || overlayUp() || !ready()) return;
  const w = fx.width, h = fx.height;
  const out = document.createElement("canvas");
  out.width = w; out.height = h;
  const octx = out.getContext("2d", { alpha: false });
  octx.translate(w, 0);
  octx.scale(-1, 1);
  compose(out, octx);

  el("flash").classList.remove("fire");
  void el("flash").offsetWidth;
  el("flash").classList.add("fire");

  // JPEG, not PNG: a 720p still drops from ~2MB to ~250KB, which matters for
  // both the upload and a gallery that loads a lot of them at once. toBlob
  // also avoids materialising a multi-megabyte base64 string on a 2GB device.
  out.toBlob(blob => {
    if (!blob) return hint("That photo didn't come out — try again");
    showReview({ kind: "photo", blob, ext: "jpg" });
  }, "image/jpeg", 0.92);
};

/* ------------------------------- Video ------------------------------- */

// mp4 first: H.264 is the codec most likely to have a hardware encoder on this
// SoC, and an mp4 plays on anything the family might open the album with.
// Memoised — the HUD asks for this every frame it's visible.
let cachedMime;
function pickMime() {
  if (cachedMime !== undefined) return cachedMime;
  cachedMime = null;
  if (typeof MediaRecorder !== "undefined") {
    const want = [
      "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
      "video/mp4",
      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp9,opus",
      "video/webm"
    ];
    for (const t of want) {
      try { if (MediaRecorder.isTypeSupported(t)) { cachedMime = t; break; } } catch (e) {}
    }
  }
  return cachedMime;
}

async function startRec() {
  // recArming as well as recording: the voice graph is built with an await, and
  // two taps inside that window would otherwise start two recorders.
  if (recording || recArming || overlayUp() || !ready()) return;

  recMime = pickMime();
  if (!recMime || typeof HTMLCanvasElement.prototype.captureStream !== "function") {
    return hint("Video recording isn't available here", 3000);
  }

  // Round to even: H.264's 4:2:0 chroma can't encode odd dimensions.
  const scale = Math.min(1, REC_WIDTH / fx.width);
  recCanvas = document.createElement("canvas");
  recCanvas.width = Math.round(fx.width * scale / 2) * 2;
  recCanvas.height = Math.round(fx.height * scale / 2) * 2;
  recCtx = recCanvas.getContext("2d", { alpha: false });
  recCtx.translate(recCanvas.width, 0);
  recCtx.scale(-1, 1);            // mirrored once; every later draw inherits it

  // frameRate 0 means "only the frames I ask for", so we encode exactly one
  // frame per camera frame instead of resampling to a fixed clock. If this
  // build can't do manual frames, fall back to a 30fps auto capture.
  let cs = recCanvas.captureStream(0);
  recTrack = cs.getVideoTracks()[0];
  const manual = recTrack && typeof recTrack.requestFrame === "function";
  if (!manual) {
    // Auto-capture samples the canvas on its own clock, so it has to be given
    // the same ceiling — otherwise it would encode the frames the composite
    // loop deliberately skipped, paying the cost the cap exists to avoid.
    cs = recCanvas.captureStream(REC_COMPOSITE_HZ);
    recTrack = cs.getVideoTracks()[0];
  }

  // The mic goes through the shifter whenever the graph is available, even at a
  // ratio of 1 — which is a bit-exact passthrough — because that is what lets a
  // child change filters part-way through a clip and have the voice follow. If
  // anything about the audio graph failed, the bare mic is used instead.
  recArming = true;
  const shifted = await ensureVoice();
  recArming = false;
  if (actx && actx.state === "suspended") { try { await actx.resume(); } catch (e) {} }
  setVoice(voiceOf(active));

  const mic = stream.getAudioTracks();
  const mixed = new MediaStream([recTrack].concat(shifted ? [shifted] : mic));

  try {
    recorder = new MediaRecorder(mixed, {
      mimeType: recMime,
      videoBitsPerSecond: REC_VIDEO_BPS,
      audioBitsPerSecond: REC_AUDIO_BPS
    });
  } catch (err) {
    // Bitrate hints are advisory; some builds reject the combination outright.
    try {
      recorder = new MediaRecorder(mixed, { mimeType: recMime });
    } catch (err2) {
      recTrack.stop();
      recCanvas = recCtx = recTrack = null;
      return hint("Video recording isn't available here", 3000);
    }
  }

  recChunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onerror = () => { hint("Recording stopped early"); stopRec(); };
  recorder.onstop = finishRec;
  recorder.start(1000);           // periodic chunks, so a crash loses ~1s, not all

  recording = true;
  recFrames = 0;
  recFps = 0;
  compMs = frameMs = lastFrameAt = 0;   // don't carry a previous clip's numbers in
  recStartedAt = performance.now();
  el("record").classList.add("on");
  el("record").textContent = "⏹";
  el("record").setAttribute("aria-label", "Stop recording");
  el("stage").classList.add("recording");
  el("rectimer").classList.add("show");
  el("shutter").disabled = true;
  el("album").disabled = true;
  hint(!mic.length ? "Recording (no microphone)"
       : shifted && voiceOf(active) !== 1 ? "Recording — say something in your " + active.name + " voice!"
       : "Recording — say something!", 2000);

  recTick = setInterval(tickRec, 200);
  pumpRecFrames(manual);
}

// Driven by the camera's own frame callback where available, so no work is
// duplicated when the camera stalls below 30fps — and rate-limited on top of
// that, because each captured frame is the +14ms.
function pumpRecFrames(manual) {
  const ema = (prev, v) => (prev ? prev * 0.8 + v * 0.2 : v);
  const minCompDt = 1000 / REC_COMPOSITE_HZ - 1;
  let lastCompAt = 0;
  const step = () => {
    if (!recording || !recCanvas) return;
    const t0 = performance.now();
    // The camera's delivery interval is recorded for every frame, composited or
    // not: it is the clock the cap is applied against.
    if (lastFrameAt) frameMs = ema(frameMs, t0 - lastFrameAt);
    lastFrameAt = t0;

    if (t0 - lastCompAt >= minCompDt) {
      lastCompAt = t0;
      compose(recCanvas, recCtx);
      if (manual) { try { recTrack.requestFrame(); } catch (e) {} }
      compMs = ema(compMs, performance.now() - t0);
      recFrames++;
    }
    schedule();
  };
  const schedule = () => {
    if (!recording) return;
    if (typeof video.requestVideoFrameCallback === "function") {
      video.requestVideoFrameCallback(step);
    } else {
      setTimeout(step, 33);
    }
  };
  schedule();
}

function tickRec() {
  const ms = performance.now() - recStartedAt;
  recFps = recFrames / (ms / 1000);
  const s = Math.floor(ms / 1000);
  el("recclock").textContent =
    Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") +
    " / 0:" + (MAX_CLIP_MS / 1000);
  if (ms >= MAX_CLIP_MS) stopRec();
}

function stopRec() {
  if (!recording) return;
  recording = false;
  clearInterval(recTick);
  el("record").classList.remove("on");
  el("record").textContent = "🎥";
  el("record").setAttribute("aria-label", "Record a video");
  el("stage").classList.remove("recording");
  el("rectimer").classList.remove("show");
  el("shutter").disabled = false;
  el("album").disabled = false;
  try { recorder.stop(); } catch (e) { finishRec(); }
}

// Runs once the recorder has flushed its last chunk.
function finishRec() {
  // Only now is it safe to drop the canvas track — stopping it earlier can
  // truncate the tail of the clip.
  if (recTrack) { try { recTrack.stop(); } catch (e) {} recTrack = null; }

  // The last composited frame becomes the clip's preview. Taken here because
  // this is the one moment it exists for free: recovering it later means
  // downloading the clip and decoding a frame, which is exactly what a gallery
  // full of video tiles should not have to do.
  let poster = null;
  if (recCanvas) {
    try { poster = recCanvas.toDataURL("image/jpeg", 0.72); } catch (e) {}
  }
  recCanvas = recCtx = null;

  // Park the audio graph until the next clip. A connected worklet keeps running
  // 375 blocks a second whether or not anyone is recording, and this device has
  // nothing to spare for that. Suspended here rather than in stopRec, because
  // the encoder is still flushing until onstop has run.
  if (actx && actx.state === "running") { try { actx.suspend(); } catch (e) {} }

  const blob = new Blob(recChunks, { type: recMime || "video/webm" });
  recChunks = [];
  recorder = null;
  if (!blob.size) return hint("That clip came out empty");

  showReview({ kind: "video", blob, poster, ext: recMime.indexOf("mp4") >= 0 ? "mp4" : "webm" });
}

el("record").onclick = () => (recording ? stopRec() : startRec());

/* ------------------------------ Review ------------------------------- */

function showReview(item) {
  discardPending();
  pending = item;
  pending.url = URL.createObjectURL(item.blob);

  const isVid = item.kind === "video";
  el("shot").hidden = isVid;
  el("clip").hidden = !isVid;
  if (isVid) {
    el("clip").src = pending.url;
    el("clip").play().catch(() => {});   // controls are there if autoplay is blocked
  } else {
    el("shot").src = pending.url;
  }

  el("keep").disabled = false;
  el("keep").textContent = "Keep it";
  say("");
  el("share").hidden = !canShare(item);
  el("review").classList.add("show");
}

function say(msg, tone) {
  const n = el("saveMsg");
  n.textContent = msg;
  n.className = tone || "";
}

function discardPending() {
  if (!pending) return;
  if (pending.url) URL.revokeObjectURL(pending.url);
  pending = null;
}

function closeReview() {
  el("review").classList.remove("show");
  const clip = el("clip");
  clip.pause();
  clip.removeAttribute("src");
  clip.load();                 // release the decoder before revoking the URL
  el("shot").removeAttribute("src");
  discardPending();
}

el("again").onclick = closeReview;

el("keep").onclick = async () => {
  if (!pending) return;
  el("keep").disabled = true;
  el("keep").textContent = "Saving…";
  say("");
  try {
    const res = await fetch("/media?ext=" + pending.ext, {
      method: "POST",
      headers: { "Content-Type": pending.blob.type || "application/octet-stream" },
      body: pending.blob
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) throw new Error(out.error || ("server said " + res.status));

    // The preview is a nicety, not part of the save: a clip that is safely
    // stored must not be reported as failed because its thumbnail wasn't.
    if (pending.poster && out.name) {
      try {
        const jpg = await (await fetch(pending.poster)).blob();
        await fetch("/media?ext=jpg&for=" + encodeURIComponent(out.name), {
          method: "POST", headers: { "Content-Type": "image/jpeg" }, body: jpg
        });
      } catch (err) { console.warn("poster upload failed:", (err && err.message) || err); }
    }

    el("keep").textContent = "Saved ✓";
    say("It's in Photos now", "good");
  } catch (err) {
    el("keep").disabled = false;
    el("keep").textContent = "Try again";
    say("Couldn't save it: " + ((err && err.message) || err), "bad");
  }
};

// The one route that could reach the Portal's own album, if its browser shell
// happens to implement share targets. Hidden entirely when it doesn't.
function shareFile(item) {
  try {
    return new File([item.blob], "portalsnap." + item.ext,
                    { type: item.blob.type || "application/octet-stream" });
  } catch (e) { return null; }
}

function canShare(item) {
  const f = shareFile(item);
  try { return !!(f && navigator.canShare && navigator.canShare({ files: [f] })); }
  catch (e) { return false; }
}

el("share").onclick = async () => {
  if (!pending) return;
  const f = shareFile(pending);
  if (!f) return;
  try { await navigator.share({ files: [f], title: "PortalSnap" }); }
  catch (err) { if (err && err.name !== "AbortError") say("Couldn't send it", "bad"); }
};

/* ------------------------------- Album ------------------------------- */

let viewing = null;   // the item open in the full-size viewer

el("album").onclick = openAlbum;
el("gclose").onclick = () => {
  closeViewer();
  el("gallery").classList.remove("show");
};

async function openAlbum() {
  if (recording) return;
  el("gallery").classList.add("show");
  el("ghelp").innerHTML =
    "To get these onto a phone, open <b>" + location.host + "/gallery.html</b> there " +
    "— the Portal itself can't save files.";

  const grid = el("grid");
  grid.textContent = "";
  grid.appendChild(note("Looking…"));
  try {
    const res = await fetch("/media/list", { cache: "no-store" });
    const out = await res.json();
    drawGrid(out.items || []);
  } catch (err) {
    grid.textContent = "";
    grid.appendChild(note("Can't reach the album right now."));
  }
}

function note(text) {
  const d = document.createElement("div");
  d.className = "empty";
  d.textContent = text;
  return d;
}

function when(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString([], {
    month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
  });
}

function drawGrid(items) {
  const grid = el("grid");
  grid.textContent = "";
  if (!items.length) {
    grid.appendChild(note("Nothing saved yet. Take a photo and tap Keep it!"));
    return;
  }
  for (const it of items) {
    const tile = document.createElement("div");
    // A clip with a preview is an image tile with a play badge over it; only one
    // without falls back to the bare marker. No <video> either way — a grid of
    // decoders would flatten this device.
    const preview = it.kind === "video" ? it.poster : it.url;
    tile.className = "tile" + (it.kind === "video" && !preview ? " vid" : "");
    if (!preview) {
      tile.textContent = "▶";
    } else {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = "";
      img.src = preview;
      tile.appendChild(img);
      if (it.kind === "video") {
        const play = document.createElement("div");
        play.className = "play";
        play.textContent = "▶";
        tile.appendChild(play);
      }
    }
    const cap = document.createElement("div");
    cap.className = "when";
    cap.textContent = when(it.at);
    tile.appendChild(cap);
    tile.onclick = () => openViewer(it);
    grid.appendChild(tile);
  }
}

function openViewer(it) {
  viewing = it;
  const isVid = it.kind === "video";
  el("vimg").hidden = isVid;
  el("vvid").hidden = !isVid;
  if (isVid) {
    el("vvid").src = it.url;
    el("vvid").play().catch(() => {});
  } else {
    el("vimg").src = it.url;
  }
  el("vdel").disabled = false;
  el("vdel").textContent = "Delete";
  el("viewer").classList.add("show");
}

function closeViewer() {
  viewing = null;
  const v = el("vvid");
  v.pause();
  v.removeAttribute("src");
  v.load();
  el("vimg").removeAttribute("src");
  el("viewer").classList.remove("show");
}

el("vclose").onclick = closeViewer;

// Two taps to delete: the first arms it, the second does it. A confirm()
// dialog on the Portal's browser is easy to mis-tap and hard to read.
el("vdel").onclick = async () => {
  if (!viewing) return;
  const btn = el("vdel");
  if (btn.textContent !== "Really delete?") { btn.textContent = "Really delete?"; return; }
  btn.disabled = true;
  const gone = viewing;
  try {
    const res = await fetch(gone.url, { method: "DELETE" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    closeViewer();
    openAlbum();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Delete failed";
  }
};

el("hudTap").onclick = () => el("hud").classList.toggle("show");

// The config sweep in bench.html measured the detector on the MAIN THREAD; the
// app runs it in a worker, where MediaPipe's GPU delegate needs OffscreenCanvas
// and can quietly fall back to CPU. Those two are not the same speed on this
// device, so this swaps between them in one tap and makes `infer` directly
// comparable — no rebuild, no retyping a URL on a touchscreen.
el("backendTap").onclick = async () => {
  if (!el("hud").classList.contains("show") || recording || overlayUp()) return;
  forceBackend = forceBackend === "main" ? null : "main";
  hint("Tracker → " + (forceBackend || "worker") + "…", 2500);
  try {
    await startTracker(trackerMode);
    trackerBroken = null;
    hint("Tracker on " + backend, 2500);
  } catch (err) {
    trackerBroken = "" + ((err && err.message) || err);
    hint("That backend wouldn't start", 2500);
  }
};

/* ---------------------------- Full screen ---------------------------- */

// The Portal's browser chrome eats 156 of the screen's 800 pixels — the viewport
// measures 1280x644 against a 1280x800 panel — so full screen is worth roughly a
// quarter more picture. The whole document goes full screen rather than the
// stage alone, because the filter strip and the shutter have to stay reachable;
// full screen with no way to take a photo would be a worse app.
const ENTER_ICON = "M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5";
const EXIT_ICON = "M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5";

// Prefixed spellings kept because this is a vendor browser shell on Chrome 138,
// and the cost of being wrong about that is a button that does nothing.
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsAllowed = () =>
  !!(document.fullscreenEnabled || document.webkitFullscreenEnabled ||
     document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);

function syncFsButton() {
  const on = !!fsElement();
  el("fsIcon").setAttribute("d", on ? EXIT_ICON : ENTER_ICON);
  el("fs").setAttribute("aria-label", on ? "Leave full screen" : "Full screen");
}

async function toggleFullscreen() {
  const root = document.documentElement;
  try {
    if (fsElement()) {
      await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      await (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
  } catch (err) {
    // Refused rather than unsupported: some shells only allow it from certain
    // gestures, or block it outright while a camera is live.
    hint("Full screen isn't allowed here", 2500);
  }
  syncFsButton();
}

if (fsAllowed()) {
  el("fs").hidden = false;
  el("fs").onclick = toggleFullscreen;
  // Covers Escape and the shell's own back gesture, not just our button.
  document.addEventListener("fullscreenchange", syncFsButton);
  document.addEventListener("webkitfullscreenchange", syncFsButton);
}

buildStrip();
boot();
</script>
</body>
</html>
