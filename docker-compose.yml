services:
  portalsnap:
    image: node:22-alpine
    container_name: portalsnap
    working_dir: /app
    command: node server.js
    volumes:
      - ./:/app
    environment:
      PORT: 8080
      # Only used to print a tappable claim link in the log on first start,
      # while no device is paired yet: `docker compose logs portalsnap`.
      PUBLIC_URL: https://portalsnap.example.net
      # SHARE_LINKS: "off"     # refuse to mint links that work without a device
      # SHARE_MAX_DAYS: 30     # the longest a link may be asked to live
    restart: unless-stopped
    networks:
      - web

# Reachable only through the cloudflared container on the shared `web` network.
# Add a Public Hostname route: portalsnap.<domain> -> http://portalsnap:8080
networks:
  web:
    external: true
